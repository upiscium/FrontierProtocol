name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read and classify release version
        shell: bash
        run: |
          set -euo pipefail
          mod_version="$(awk -F= '$1 == "mod_version" { print $2 }' gradle.properties)"
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?(\+([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$mod_version" =~ $semver_pattern ]]; then
            echo "Malformed or unsupported SemVer: $mod_version" >&2
            exit 1
          fi

          version_without_build="${mod_version%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            prerelease="${version_without_build#*-}"
            IFS='.' read -ra identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" != "0" && "$identifier" == 0* ]]; then
                echo "Malformed numeric prerelease identifier: $identifier" >&2
                exit 1
              fi
            done
            release_status="public_alpha_prerelease"
            is_prerelease="true"
          else
            release_status="public_stable_release"
            is_prerelease="false"
          fi

          jar_name="frontier_protocol-${mod_version}.jar"
          checksum_name="${jar_name}.sha256"
          release_title="Frontier Protocol ${mod_version}"
          release_notes="docs/releases/${mod_version}.md"
          test "$GITHUB_REF_NAME" = "v${mod_version}"
          test -f "$release_notes"

          {
            printf 'MOD_VERSION=%s\n' "$mod_version"
            printf 'RELEASE_STATUS=%s\n' "$release_status"
            printf 'IS_PRERELEASE=%s\n' "$is_prerelease"
            printf 'JAR_NAME=%s\n' "$jar_name"
            printf 'CHECKSUM_NAME=%s\n' "$checksum_name"
            printf 'RELEASE_TITLE=%s\n' "$release_title"
            printf 'RELEASE_NOTES=%s\n' "$release_notes"
          } >> "$GITHUB_ENV"

      - name: Require tagged commit on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Require unpublished tag
        run: |
          set -euo pipefail
          error_file="$RUNNER_TEMP/release-view-error.txt"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>"$error_file"; then
            echo "A GitHub Release already exists for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if ! grep -qi 'release not found' "$error_file"; then
            cat "$error_file" >&2
            exit 1
          fi

      - name: Run unit and asset tests
        run: ./gradlew test

      - name: Run data generation
        run: ./gradlew runData

      - name: Verify generated data is committed
        run: test -z "$(git status --porcelain --untracked-files=all -- src/generated/resources)"

      - name: Build clean artifact
        run: ./gradlew clean build

      - name: Run GameTests
        run: ./gradlew runGameTestServer

      - name: Run dedicated-server smoke
        run: ./gradlew dedicatedServerSmoke

      - name: Require completed stable gates
        if: env.IS_PRERELEASE == 'false'
        run: ./gradlew verifyStableReleaseGates

      - name: Verify public release candidate
        run: ./gradlew verifyReleaseCandidate -PreleaseStatus="$RELEASE_STATUS"

      - name: Require exact candidate contents
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/expected-candidate-files.txt"
          actual="$RUNNER_TEMP/actual-candidate-files.txt"
          printf '%s\n' \
            "$JAR_NAME" \
            "$CHECKSUM_NAME" \
            LICENSE \
            release-manifest.json | sort > "$expected"
          find build/release/candidate -mindepth 1 -maxdepth 1 -printf '%f\n' | sort > "$actual"
          diff -u "$expected" "$actual"

      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "build/release/candidate/${JAR_NAME}"
            "build/release/candidate/${CHECKSUM_NAME}"
            build/release/candidate/release-manifest.json
            build/release/candidate/LICENSE
          )
          release_args=(
            --verify-tag
            --title "$RELEASE_TITLE"
            --notes-file "$RELEASE_NOTES"
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${release_args[@]}"

      - name: Verify published release
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/published-release.json"
          published_dir="$(mktemp -d "$RUNNER_TEMP/published-assets.XXXXXX")"
          anonymous_dir="$(mktemp -d "$RUNNER_TEMP/anonymous-assets.XXXXXX")"
          expected_assets="$RUNNER_TEMP/expected-published-assets.txt"
          actual_assets="$RUNNER_TEMP/actual-published-assets.txt"
          expected_jar_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${JAR_NAME}"
          expected_checksum_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${CHECKSUM_NAME}"

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" > "$release_json"
          jq -e \
            --arg tag "$GITHUB_REF_NAME" \
            --argjson prerelease "$IS_PRERELEASE" \
            '.tag_name == $tag and .prerelease == $prerelease and .draft == false' \
            "$release_json" >/dev/null
          printf '%s\n' \
            "$JAR_NAME" \
            "$CHECKSUM_NAME" \
            LICENSE \
            release-manifest.json | sort > "$expected_assets"
          jq -r '.assets[].name' "$release_json" | sort > "$actual_assets"
          diff -u "$expected_assets" "$actual_assets"

          jar_url="$(jq --exit-status --raw-output --arg name "$JAR_NAME" \
            '.assets[] | select(.name == $name) | .browser_download_url' \
            "$release_json")"
          checksum_url="$(jq --exit-status --raw-output --arg name "$CHECKSUM_NAME" \
            '.assets[] | select(.name == $name) | .browser_download_url' \
            "$release_json")"
          test "$jar_url" = "$expected_jar_url"
          test "$checksum_url" = "$expected_checksum_url"

          download_public_asset() {
            env -u GH_TOKEN -u GITHUB_TOKEN curl --fail --location \
              --silent \
              --show-error \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 2 \
              --output "$1" \
              "$2"
          }
          download_public_asset "$anonymous_dir/$JAR_NAME" "$jar_url"
          download_public_asset "$anonymous_dir/$CHECKSUM_NAME" "$checksum_url"
          (
            cd "$anonymous_dir"
            sha256sum --check "$CHECKSUM_NAME"
          )
          cmp "build/release/candidate/$JAR_NAME" "$anonymous_dir/$JAR_NAME"

          gh release download "$GITHUB_REF_NAME" --dir "$published_dir"
          find "$published_dir" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort > "$actual_assets"
          diff -u "$expected_assets" "$actual_assets"
          (
            cd "$published_dir"
            sha256sum --check "$CHECKSUM_NAME"
          )
          cmp "build/release/candidate/$JAR_NAME" "$published_dir/$JAR_NAME"
          jq -e \
            --arg version "$MOD_VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg release_status "$RELEASE_STATUS" \
            '.mod.version == $version and .source.git_commit == $commit and
              .release_status == $release_status' \
            "$published_dir/release-manifest.json" >/dev/null

      - name: Write packwiz installation summary
        run: |
          jar_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${JAR_NAME}"
          {
            printf '%s\n\n' "$jar_url"
            printf '%s\n' '```bash'
            printf 'packwiz url add --meta-folder mods "Frontier Protocol" \\\n  "%s"\n' "$jar_url"
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
