name: RC Soak Evidence

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full merged RC or Stable candidate commit SHA
        required: true
        type: string
      duration_minutes:
        description: Steady-state evidence duration in minutes
        required: true
        default: '120'
        type: string

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    steps:
      - name: Validate evidence inputs
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
        run: |
          set -euo pipefail
          [[ "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$DURATION_MINUTES" =~ ^[0-9]+$ ]]
          test "$DURATION_MINUTES" -ge 120

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          fetch-tags: false

      - name: Require merged RC or Stable source candidate
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${COMMIT_SHA,,}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main
          mod_version="$(awk -F= '$1 == "mod_version" { print $2 }' gradle.properties)"
          version_without_build="${mod_version%%+*}"
          [[ "$version_without_build" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]]

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build clean candidate
        run: ./gradlew clean build

      - name: Verify Alpha world migration
        run: ./gradlew alpha1WorldUpgradeSmoke --offline

      - name: Run retained RC soak
        env:
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
        run: ./gradlew releaseCandidateSoak -PsoakDurationMinutes="$DURATION_MINUTES" --offline

      - name: Upload retained RC soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-soak-${{ inputs.commit_sha }}
          path: |
            build/rc-soak/server/rc-soak.log
            build/rc-soak/rc-soak-results.json
          if-no-files-found: error
          retention-days: 14
