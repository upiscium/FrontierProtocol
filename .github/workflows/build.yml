name: Build

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Require main for manual candidate
        if: github.event_name == 'workflow_dispatch'
        run: test "${GITHUB_REF}" = "refs/heads/main"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit and asset tests
        run: ./gradlew test

      - name: Run data generation
        run: ./gradlew runData

      - name: Verify generated data is committed
        run: test -z "$(git status --porcelain --untracked-files=all -- src/generated/resources)"

      - name: Build clean artifact
        run: ./gradlew clean build

      - name: Run GameTests
        run: ./gradlew runGameTestServer

      - name: Assemble release candidate
        run: ./gradlew verifyReleaseCandidate

      - name: Upload release candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontier_protocol-0.1.0-alpha.1-release-candidate
          path: build/release/candidate/*
          if-no-files-found: error
          retention-days: 14
