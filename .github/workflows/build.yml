name: Build

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Require main for manual candidate
        if: github.event_name == 'workflow_dispatch'
        run: test "${GITHUB_REF}" = "refs/heads/main"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit and asset tests
        run: ./gradlew test

      - name: Run data generation
        run: ./gradlew runData

      - name: Verify generated data is committed
        run: test -z "$(git status --porcelain --untracked-files=all -- src/generated/resources)"

      - name: Build clean artifact
        run: ./gradlew clean build

      - name: Run GameTests
        run: ./gradlew runGameTestServer

      - name: Run dedicated-server smoke
        id: dedicated-server-smoke
        run: ./gradlew dedicatedServerSmoke

      - name: Upload failed dedicated-server smoke log
        if: failure() && steps.dedicated-server-smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: dedicated-server-smoke-log
          path: build/dedicated-server-smoke/dedicated-server.log
          if-no-files-found: warn
          retention-days: 14

      - name: Run Stable startup matrix
        id: stable-startup-matrix
        run: ./gradlew stableStartupMatrix

      - name: Upload failed Stable startup matrix evidence
        if: failure() && steps.stable-startup-matrix.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: stable-startup-matrix-evidence
          path: |
            build/stable-startup-matrix/**/*.log
            build/stable-startup-matrix/*-results.properties
          if-no-files-found: warn
          retention-days: 14

      - name: Run Alpha world migration smoke
        id: alpha1-world-upgrade-smoke
        run: ./gradlew alpha1WorldUpgradeSmoke --offline

      - name: Upload failed Alpha world migration evidence
        if: failure() && steps.alpha1-world-upgrade-smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: alpha1-world-upgrade-evidence
          path: |
            build/alpha1-world-upgrade/server/*.log
            build/alpha1-world-upgrade/alpha1-world-upgrade-results.properties
          if-no-files-found: warn
          retention-days: 14

      - name: Validate RC soak harness
        id: release-candidate-soak
        run: >-
          ./gradlew releaseCandidateSoak
          -PsoakDurationMinutes=2
          -PallowShortSoak=true
          --offline

      - name: Upload failed RC soak harness evidence
        if: failure() && steps.release-candidate-soak.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rc-soak-harness-evidence
          path: |
            build/rc-soak/server/rc-soak.log
            build/rc-soak/rc-soak-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Assemble release candidate
        run: ./gradlew verifyReleaseCandidate

      - name: Upload release candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontier_protocol-0.1.0-rc.1-release-candidate
          path: build/release/candidate/*
          if-no-files-found: error
          retention-days: 14
