plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

def supportedReleaseStatuses = [
        'internal_alpha_candidate',
        'public_alpha_prerelease',
        'public_stable_release'
] as Set
def defaultReleaseStatus = 'internal_alpha_candidate'
def releaseStatus = providers.gradleProperty('releaseStatus').orElse(defaultReleaseStatus).get()
if (!supportedReleaseStatuses.contains(releaseStatus)) {
    throw new GradleException(
            "Unsupported releaseStatus '${releaseStatus}'. Expected one of: ${supportedReleaseStatuses.sort().join(', ')}")
}
def classifyPublicRelease = { String candidateVersion ->
    def semVer = candidateVersion =~ /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/
    if (!semVer.matches()) {
        throw new GradleException("Malformed or unsupported SemVer: '${candidateVersion}'")
    }
    boolean prerelease = semVer.group(4) != null
    [
            status    : prerelease ? 'public_alpha_prerelease' : 'public_stable_release',
            prerelease: prerelease
    ]
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("**/.cache") // datagen cache directories
    exclude("**/.cache/**") // datagen cache contents
}

sourceSets {
    fixtureBuilder {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

def generatedGameTestResources = layout.buildDirectory.dir('generated/gametestResources')
def createGameTestJar = configurations.compileClasspath.elements.map { files ->
    def artifact = files.find { it.asFile.name.startsWith('create-1.21.1-') }
    if (artifact == null) throw new GradleException('Create jar not found for GameTest structure generation')
    artifact.asFile
}
tasks.register('generateGameTestStructure') {
    inputs.file(createGameTestJar)
    outputs.dir(generatedGameTestResources)
    doLast {
        def output = generatedGameTestResources.get().file('data/frontier_protocol/structure/empty.nbt').asFile
        output.parentFile.mkdirs()
        output.withOutputStream { raw ->
            new java.util.zip.GZIPOutputStream(raw).withCloseable { gzip ->
                new DataOutputStream(gzip).withCloseable { nbt ->
                    nbt.writeByte(10); nbt.writeUTF('')
                    nbt.writeByte(3); nbt.writeUTF('DataVersion'); nbt.writeInt(3955)
                    nbt.writeByte(9); nbt.writeUTF('size'); nbt.writeByte(3); nbt.writeInt(3)
                    nbt.writeInt(1); nbt.writeInt(1); nbt.writeInt(1)
                    ['palette', 'blocks', 'entities'].each { name ->
                        nbt.writeByte(9); nbt.writeUTF(name); nbt.writeByte(10); nbt.writeInt(0)
                    }
                    nbt.writeByte(0)
                }
            }
        }

        def physicalMixing = generatedGameTestResources.get()
                .file('data/frontier_protocol/structure/r9_unheated_mixing.nbt').asFile
        physicalMixing.parentFile.mkdirs()
        new java.util.zip.ZipFile(createGameTestJar.get()).withCloseable { zip ->
            def entry = zip.getEntry('data/create/structure/gametest/processing/brass_mixing.nbt')
            if (entry == null) throw new GradleException('Create physical mixing GameTest structure not found')
            zip.getInputStream(entry).withCloseable { input ->
                physicalMixing.withOutputStream { outputStream -> input.transferTo(outputStream) }
            }
        }
    }
}
sourceSets.main.resources.srcDir(generatedGameTestResources)
tasks.named('processResources').configure { dependsOn('generateGameTestStructure') }

repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.tterrag.com' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.blamejared.com' }
    exclusiveContent {
        forRepository {
            maven { url = 'https://cursemaven.com' }
        }
        filter { includeGroup 'curse.maven' }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        dedicatedServerSmokeRuntime {
            server()
            gameDirectory = layout.buildDirectory.dir('dedicated-server-smoke/server').get().asFile
            programArgument '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods.frontier_protocol
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "com.simibubi.create:create-${minecraft_version}:${create_version}"
    implementation "curse.maven:fungal-infection-spore-678295:${spore_file_id}"
    implementation "maven.modrinth:create-tfmg:${tfmg_version}"

    if (project.hasProperty('enableOptionalCompatRuntime')) {
        localRuntime "maven.modrinth:sable:${sable_version}"
        localRuntime "maven.modrinth:create-aeronautics:${aeronautics_version}"
    }

    if (project.hasProperty('enableRecipeViewerRuntime')) {
        localRuntime "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    }

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

def productionJar = tasks.named('jar', Jar)
def productionJarFile = productionJar.flatMap { it.archiveFile }
def fixtureBuilderJar = tasks.register('fixtureBuilderJar', Jar) {
    group = 'fixture generation'
    description = 'Builds the generation-only Alpha migration fixture helper.'
    archiveClassifier = 'alpha1-fixture-builder'
    from sourceSets.fixtureBuilder.output
}
def fixtureBuilderJarFile = fixtureBuilderJar.flatMap { it.archiveFile }
def repositoryLicense = layout.projectDirectory.file('LICENSE')
def createLicenseNotice = layout.projectDirectory.file('src/main/resources/META-INF/LICENSES/Create-LICENSE.md')
def neoForgeMdkTemplateNotice = layout.projectDirectory.file('TEMPLATE_LICENSE.txt')
def canonicalLicenseSha256 = '08f5b811516c01ae6bdda845ed9f7284da0e909bccf554769e104db4b681ba4c'
def activeLicenseClaimFiles = files(
        'README.md',
        'CHANGELOG.md',
        'gradle.properties',
        'src/main/templates/META-INF/neoforge.mods.toml',
        fileTree('docs') { include '**/*.md' })
def activeLicenseClaimPaths = activeLicenseClaimFiles.files.collect { it.absolutePath }.sort()
productionJar.configure {
    from(repositoryLicense)
    from(neoForgeMdkTemplateNotice) {
        into 'META-INF/LICENSES'
        rename { 'NeoForge-MDK-TEMPLATE-LICENSE.txt' }
    }
}
def releaseRoot = layout.buildDirectory.dir('release')
def releaseMetadataDir = layout.buildDirectory.dir('release/metadata')
def releaseCandidateDir = layout.buildDirectory.dir('release/candidate')
def releaseChecksum = productionJarFile.flatMap { jar ->
    releaseMetadataDir.map { directory -> directory.file("${jar.asFile.name}.sha256") }
}
def releaseManifest = releaseMetadataDir.map { it.file('release-manifest.json') }
def localGitCommit = providers.exec {
    commandLine 'git', 'rev-parse', 'HEAD'
}.standardOutput.asText.map { it.trim() }
def sourceCommit = providers.environmentVariable('GITHUB_SHA').orElse(localGitCommit)
def releaseJavaVersion = java.toolchain.languageVersion.get().asInt().toString()

def verifyReleaseJar = tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Verifies production JAR contents and expanded mod metadata.'
    dependsOn productionJar
    inputs.file(productionJarFile)
    inputs.file(repositoryLicense)
    inputs.file(createLicenseNotice)
    inputs.file(neoForgeMdkTemplateNotice)
    inputs.files(activeLicenseClaimFiles)
    inputs.property('production_jar_path', productionJarFile.map { it.asFile.absolutePath })
    inputs.properties([
            mod_id                   : mod_id,
            mod_license              : mod_license,
            mod_version              : mod_version,
            canonical_license_sha256 : canonicalLicenseSha256,
            repository_license_path  : repositoryLicense.asFile.absolutePath,
            create_notice_path       : createLicenseNotice.asFile.absolutePath,
            neoforge_mdk_notice_path : neoForgeMdkTemplateNotice.asFile.absolutePath,
            active_license_claim_paths: activeLicenseClaimPaths,
            minecraft_version_range  : minecraft_version_range,
            neo_version              : neo_version,
            create_mod_version       : create_mod_version,
            tfmg_version             : tfmg_version,
            spore_version            : spore_version
    ])

    doLast {
        Map<String, Object> releaseProperties = inputs.properties
        File jarFile = new File(releaseProperties.production_jar_path.toString())
        File repositoryLicenseFile = new File(releaseProperties.repository_license_path.toString())
        File createNoticeFile = new File(releaseProperties.create_notice_path.toString())
        File neoForgeMdkNoticeFile = new File(releaseProperties.neoforge_mdk_notice_path.toString())
        byte[] repositoryLicenseBytes = java.nio.file.Files.readAllBytes(repositoryLicenseFile.toPath())
        String repositoryLicenseSha256 = java.security.MessageDigest.getInstance('SHA-256')
                .digest(repositoryLicenseBytes).encodeHex().toString()
        if (repositoryLicenseSha256 != releaseProperties.canonical_license_sha256) {
            throw new GradleException('Repository LICENSE does not match the canonical BSD-3-Clause contract')
        }
        releaseProperties.active_license_claim_paths.each { path ->
            File file = new File(path.toString())
            String text = file.getText('UTF-8')
            if (text =~ /(?is)(Frontier Protocol.{0,120}All Rights Reserved|All Rights Reserved.{0,120}Frontier Protocol|mod_license\s*=\s*All Rights Reserved)/) {
                throw new GradleException("Active All Rights Reserved project claim remains in ${file}")
            }
        }
        new java.util.zip.ZipFile(jarFile).withCloseable { jar ->
            Set<String> entries = jar.entries().collect { it.name }.toSet()
            Set<String> requiredEntries = [
                    'LICENSE',
                    'META-INF/neoforge.mods.toml',
                    'META-INF/LICENSES/Create-LICENSE.md',
                    'META-INF/LICENSES/NeoForge-MDK-TEMPLATE-LICENSE.txt',
                    'frontier_protocol.mixins.json',
                    'assets/frontier_protocol/lang/en_us.json',
                    'assets/frontier_protocol/lang/ja_jp.json',
                    'assets/frontier_protocol/models/block/stabilizer_casing_machine.json',
                    'assets/frontier_protocol/models/item/stabilization_compound.json',
                    'assets/frontier_protocol/models/item/stabilization_cell.json',
                    'assets/frontier_protocol/textures/item/stabilization_compound.png',
                    'assets/frontier_protocol/textures/item/stabilization_cell.png',
                    'dev/upiscium/frontierprotocol/FrontierProtocolMod.class'
            ]
            (1..3).each { tier ->
                requiredEntries.add("assets/frontier_protocol/blockstates/tier_${tier}_stabilizer.json")
                requiredEntries.add("assets/frontier_protocol/models/item/tier_${tier}_stabilizer.json")
                ['offline', 'active', 'grace_period'].each { status ->
                    requiredEntries.add(
                            "assets/frontier_protocol/models/block/tier_${tier}_stabilizer_${status}.json")
                }
                ['front', 'back', 'side', 'top_offline', 'top_active', 'top_grace'].each { texture ->
                    requiredEntries.add(
                            "assets/frontier_protocol/textures/block/tier_${tier}_stabilizer_${texture}.png")
                }
            }
            Set<String> missing = requiredEntries - entries
            if (!missing.isEmpty()) throw new GradleException("Production JAR is missing entries: ${missing.sort()}")

            [
                    'dev/upiscium/frontierprotocol/stabilizer/',
                    'dev/upiscium/frontierprotocol/suppression/',
                    'dev/upiscium/frontierprotocol/cleanup/',
                    'dev/upiscium/frontierprotocol/mixin/'
            ].each { prefix ->
                if (!entries.any { it.startsWith(prefix) && it.endsWith('.class') }) {
                    throw new GradleException("Production JAR is missing classes under ${prefix}")
                }
            }

            Set<String> forbiddenExact = [
                    'assets/frontier_protocol/models/block/tier_1_stabilizer_core.json',
                    'assets/frontier_protocol/models/block/tier_1_stabilizer_gear.json'
            ]
            List<String> forbiddenPrefixes = [
                    'src/', 'run/', 'run-data/', '.gradle/', '.git/',
                    'net/minecraft/', 'net/neoforged/',
                    'com/simibubi/create/', 'com/Harbinger/Spore/', 'com/drmangotea/tfmg/'
            ]
            Set<String> forbidden = entries.findAll { entry ->
                forbiddenExact.contains(entry)
                        || forbiddenPrefixes.any { entry.startsWith(it) }
                        || entry.endsWith('.bbmodel')
                        || entry == '.cache'
                        || entry.startsWith('.cache/')
                        || entry.endsWith('/.cache')
                        || entry.contains('/.cache/')
                        || entry.endsWith('.jar')
            }
            if (!forbidden.isEmpty()) {
                throw new GradleException("Production JAR contains forbidden entries: ${forbidden.sort()}")
            }

            byte[] packagedLicense = jar.getInputStream(jar.getEntry('LICENSE')).readAllBytes()
            if (!java.util.Arrays.equals(packagedLicense, repositoryLicenseBytes)) {
                throw new GradleException('Production JAR LICENSE differs from the repository LICENSE')
            }
            byte[] packagedCreateNotice = jar.getInputStream(
                    jar.getEntry('META-INF/LICENSES/Create-LICENSE.md')).readAllBytes()
            if (!java.util.Arrays.equals(
                    packagedCreateNotice, java.nio.file.Files.readAllBytes(createNoticeFile.toPath()))) {
                throw new GradleException('Production JAR does not preserve the audited Create license notice')
            }
            byte[] packagedNeoForgeMdkNotice = jar.getInputStream(
                    jar.getEntry('META-INF/LICENSES/NeoForge-MDK-TEMPLATE-LICENSE.txt')).readAllBytes()
            if (!java.util.Arrays.equals(
                    packagedNeoForgeMdkNotice,
                    java.nio.file.Files.readAllBytes(neoForgeMdkNoticeFile.toPath()))) {
                throw new GradleException(
                        'Production JAR NeoForge MDK template notice differs from TEMPLATE_LICENSE.txt')
            }

            String metadata = jar.getInputStream(jar.getEntry('META-INF/neoforge.mods.toml'))
                    .getText(java.nio.charset.StandardCharsets.UTF_8.name())
            if (metadata.contains('${')) throw new GradleException('Production metadata contains an unexpanded template')
            [
                    "modId=\"${releaseProperties.mod_id}\"",
                    "license=\"${releaseProperties.mod_license}\"",
                    "version=\"${releaseProperties.mod_version}\"",
                    "versionRange=\"${releaseProperties.minecraft_version_range}\"",
                    "versionRange=\"[${releaseProperties.neo_version},)\"",
                    "versionRange=\"[${releaseProperties.create_mod_version},)\"",
                    "versionRange=\"[${releaseProperties.tfmg_version},)\"",
                    "versionRange=\"[${releaseProperties.spore_version}]\""
            ].each { expected ->
                if (!metadata.contains(expected)) {
                    throw new GradleException("Production metadata is missing ${expected}")
                }
            }
            List<String> dependencyBlocks = metadata.split(
                    java.util.regex.Pattern.quote("[[dependencies.${releaseProperties.mod_id}]]"))
                    .drop(1)
            ['neoforge', 'minecraft', 'create', 'tfmg', 'spore'].each { dependency ->
                String dependencyBlock = dependencyBlocks.find { block ->
                    block.contains("modId=\"${dependency}\"")
                }
                if (dependencyBlock == null
                        || !dependencyBlock.contains('type="required"')
                        || !dependencyBlock.contains('side="BOTH"')) {
                    throw new GradleException("Production metadata does not require ${dependency} on BOTH sides")
                }
            }

            byte[] mainClass = jar.getInputStream(
                    jar.getEntry('dev/upiscium/frontierprotocol/FrontierProtocolMod.class')).readAllBytes()
            int classMajorVersion = ((mainClass[6] & 0xFF) << 8) | (mainClass[7] & 0xFF)
            if (classMajorVersion != 65) {
                throw new GradleException("Production classes do not target Java 21: major=${classMajorVersion}")
            }
        }
    }
}

def generateReleaseChecksum = tasks.register('generateReleaseChecksum') {
    group = 'build'
    description = 'Generates the production JAR SHA-256 checksum.'
    dependsOn verifyReleaseJar
    inputs.file(productionJarFile)
    outputs.file(releaseChecksum)

    doLast {
        File jarFile = inputs.files.singleFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        jarFile.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int count
            while ((count = input.read(buffer)) >= 0) {
                if (count > 0) digest.update(buffer, 0, count)
            }
        }
        File checksumFile = outputs.files.singleFile
        checksumFile.parentFile.mkdirs()
        checksumFile.setText("${digest.digest().encodeHex()}  ${jarFile.name}\n", 'UTF-8')
    }
}

def generateReleaseManifest = tasks.register('generateReleaseManifest') {
    group = 'build'
    description = 'Generates the reproducible release manifest.'
    dependsOn generateReleaseChecksum
    inputs.files(productionJarFile, releaseChecksum)
    inputs.property('source_commit', sourceCommit)
    inputs.property('production_jar_path', productionJarFile.map { it.asFile.absolutePath })
    inputs.property('release_checksum_path', releaseChecksum.map { it.asFile.absolutePath })
    inputs.property('release_status', releaseStatus)
    inputs.properties([
            mod_id            : mod_id,
            mod_name          : mod_name,
            mod_version       : mod_version,
            minecraft_version : minecraft_version,
            java_version      : releaseJavaVersion,
            neo_version       : neo_version,
            create_version    : create_version,
            create_mod_version: create_mod_version,
            tfmg_version      : tfmg_version,
            spore_version     : spore_version,
            spore_file_id     : spore_file_id
    ])
    outputs.file(releaseManifest)

    doLast {
        Map<String, Object> releaseProperties = inputs.properties
        String commit = releaseProperties.source_commit.toString().trim()
        if (!(commit ==~ /[0-9a-fA-F]{40}/)) {
            throw new GradleException("Unable to resolve a full Git commit SHA: '${commit}'")
        }
        File jarFile = new File(releaseProperties.production_jar_path.toString())
        File checksumFile = new File(releaseProperties.release_checksum_path.toString())
        String checksum = checksumFile.getText('UTF-8').tokenize().first()
        Map<String, Object> manifest = [
                schema_version: 1,
                release_status: releaseProperties.release_status,
                mod           : [
                        id     : releaseProperties.mod_id,
                        name   : releaseProperties.mod_name,
                        version: releaseProperties.mod_version
                ],
                source        : [git_commit: commit.toLowerCase(java.util.Locale.ROOT)],
                platform      : [
                        minecraft: releaseProperties.minecraft_version,
                        java     : releaseProperties.java_version,
                        neoforge : releaseProperties.neo_version
                ],
                dependencies  : [
                        create_artifact: releaseProperties.create_version,
                        create_mod     : releaseProperties.create_mod_version,
                        tfmg           : releaseProperties.tfmg_version,
                        spore          : releaseProperties.spore_version,
                        spore_file_id  : releaseProperties.spore_file_id
                ],
                artifact      : [filename: jarFile.name, sha256: checksum]
        ]
        File manifestFile = outputs.files.singleFile
        manifestFile.parentFile.mkdirs()
        manifestFile.setText(
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)) + '\n',
                'UTF-8')
    }
}

def assembleReleaseCandidate = tasks.register('assembleReleaseCandidate', Sync) {
    group = 'build'
    description = 'Assembles the verified four-file Release Candidate bundle.'
    dependsOn productionJar, generateReleaseChecksum, generateReleaseManifest
    inputs.property('jar_name', productionJarFile.map { it.asFile.name })
    inputs.file(repositoryLicense)
    into releaseCandidateDir
    from productionJarFile
    from releaseChecksum
    from releaseManifest
    from repositoryLicense

    doLast {
        File candidateDirectory = outputs.files.singleFile
        String jarName = inputs.properties.jar_name
        Set<String> expected = [jarName, "${jarName}.sha256", 'release-manifest.json', 'LICENSE']
        Set<String> actual = candidateDirectory.listFiles().findAll { it.isFile() }.collect { it.name }.toSet()
        if (actual != expected || candidateDirectory.listFiles().any { it.isDirectory() }) {
            throw new GradleException("Unexpected Release Candidate contents: ${actual.sort()}")
        }
    }
}

tasks.register('verifyReleaseCandidate') {
    group = 'verification'
    description = 'Verifies the candidate checksum, manifest, and exact file set.'
    dependsOn assembleReleaseCandidate
    inputs.dir(releaseCandidateDir)
    inputs.file(repositoryLicense)
    inputs.property('candidate_directory', releaseCandidateDir.map { it.asFile.absolutePath })
    inputs.property('repository_license_path', repositoryLicense.asFile.absolutePath)
    inputs.property('jar_name', productionJarFile.map { it.asFile.name })
    inputs.property('release_status', releaseStatus)
    inputs.properties([
            mod_id            : mod_id,
            mod_name          : mod_name,
            mod_version       : mod_version,
            minecraft_version : minecraft_version,
            java_version      : releaseJavaVersion,
            neo_version       : neo_version,
            create_version    : create_version,
            create_mod_version: create_mod_version,
            tfmg_version      : tfmg_version,
            spore_version     : spore_version,
            spore_file_id     : spore_file_id
    ])

    doLast {
        Map<String, Object> releaseProperties = inputs.properties
        File candidateDirectory = new File(releaseProperties.candidate_directory.toString())
        String jarName = releaseProperties.jar_name
        Set<String> expected = [jarName, "${jarName}.sha256", 'release-manifest.json', 'LICENSE']
        Set<String> actual = candidateDirectory.listFiles().findAll { it.isFile() }.collect { it.name }.toSet()
        if (actual != expected || candidateDirectory.listFiles().any { it.isDirectory() }) {
            throw new GradleException("Unexpected Release Candidate contents: ${actual.sort()}")
        }
        if (java.nio.file.Files.mismatch(
                new File(candidateDirectory, 'LICENSE').toPath(),
                new File(releaseProperties.repository_license_path.toString()).toPath()) != -1L) {
            throw new GradleException('Release Candidate LICENSE differs from the repository LICENSE')
        }

        File jarFile = new File(candidateDirectory, jarName)
        File checksumFile = new File(candidateDirectory, "${jarName}.sha256")
        def checksumMatch = checksumFile.getText('UTF-8') =~ /^([0-9a-f]{64})  (.+)\n$/
        if (!checksumMatch.matches() || checksumMatch.group(2) != jarName) {
            throw new GradleException('Release checksum has an invalid format or JAR filename')
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        jarFile.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int count
            while ((count = input.read(buffer)) >= 0) {
                if (count > 0) digest.update(buffer, 0, count)
            }
        }
        String checksum = digest.digest().encodeHex().toString()
        if (checksum != checksumMatch.group(1)) throw new GradleException('Release checksum does not match the JAR')

        Map<String, Object> manifest = new groovy.json.JsonSlurper().parse(
                new File(candidateDirectory, 'release-manifest.json'))
        if (manifest.schema_version != 1 || manifest.release_status != releaseProperties.release_status
                || manifest.mod.id != releaseProperties.mod_id
                || manifest.mod.name != releaseProperties.mod_name
                || manifest.mod.version != releaseProperties.mod_version
                || manifest.platform.minecraft != releaseProperties.minecraft_version
                || manifest.platform.java != releaseProperties.java_version
                || manifest.platform.neoforge != releaseProperties.neo_version
                || manifest.dependencies.create_artifact != releaseProperties.create_version
                || manifest.dependencies.create_mod != releaseProperties.create_mod_version
                || manifest.dependencies.tfmg != releaseProperties.tfmg_version
                || manifest.dependencies.spore != releaseProperties.spore_version
                || manifest.dependencies.spore_file_id != releaseProperties.spore_file_id
                || manifest.artifact.filename != jarName
                || manifest.artifact.sha256 != checksum) {
            throw new GradleException('Release manifest does not match the candidate or Gradle properties')
        }
        if (!(manifest.source.git_commit ==~ /[0-9a-fA-F]{40}/)) {
            throw new GradleException('Release manifest does not contain a full Git commit SHA')
        }
    }
}

def stableGateDocument = layout.projectDirectory.file('docs/releases/0.1.0-stable-gates.md')
def requiredStableGateIds = [
        'unit-tests',
        'asset-tests',
        'clean-datagen',
        'clean-build',
        'all-gametests',
        'dedicated-server-smoke',
        'stable-candidate',
        'fresh-world-smoke',
        'alpha1-world-upgrade',
        'english-graphical-smoke',
        'japanese-graphical-smoke',
        'packwiz-candidate-smoke',
        'published-checksum',
        'published-byte-identity',
        'support-contract',
        'known-issues',
        'changelog',
        'stable-release-notes',
        'license-provenance'
] as Set
def parseStableGates = { String text ->
    Map<String, String> gates = [:]
    text.eachLine { line ->
        def row = line =~ /^\| ([a-z0-9-]+) \| yes \| (COMPLETE|INCOMPLETE|WORKFLOW_ENFORCED) \|/
        if (row.find()) gates[row.group(1)] = row.group(2)
    }
    gates
}

tasks.register('verifyStableReleaseGates') {
    group = 'verification'
    description = 'Fails unless every required pre-publication stable gate is complete.'
    inputs.file(stableGateDocument)

    doLast {
        Map<String, String> gates = parseStableGates(stableGateDocument.asFile.getText('UTF-8'))
        if (gates.keySet() != requiredStableGateIds) {
            throw new GradleException("Stable gate IDs differ from the required contract: ${gates.keySet().sort()}")
        }
        Set<String> workflowEnforced = gates.findAll { id, status -> status == 'WORKFLOW_ENFORCED' }.keySet()
        if (workflowEnforced != ['published-checksum', 'published-byte-identity'] as Set) {
            throw new GradleException('Only post-publication checksum and byte identity may be workflow-enforced')
        }
        Map<String, String> incomplete = gates.findAll { id, status -> status == 'INCOMPLETE' }
        if (!incomplete.isEmpty()) {
            throw new GradleException("Stable release gates are incomplete: ${incomplete.keySet().sort()}")
        }
    }
}

def verifyReleaseSafeguards = tasks.register('verifyReleaseSafeguards') {
    group = 'verification'
    description = 'Statically verifies release workflow, documentation, and pinned release inputs.'

    def buildWorkflow = layout.projectDirectory.file('.github/workflows/build.yml')
    def releaseWorkflow = layout.projectDirectory.file('.github/workflows/release.yml')
    def readme = layout.projectDirectory.file('README.md')
    def readmeJa = layout.projectDirectory.file('README.ja.md')
    def changelog = layout.projectDirectory.file('CHANGELOG.md')
    def alphaRelease = layout.projectDirectory.file('docs/alpha-release.md')
    def releaseNotes = layout.projectDirectory.file('docs/releases/0.1.0-alpha.1.md')
    def publicationRecord = layout.projectDirectory.file('docs/releases/0.1.0-alpha.1-publication.md')
    def stableReadiness = layout.projectDirectory.file('docs/stable-readiness-0.1.0.md')
    def stableKnownIssues = layout.projectDirectory.file('docs/releases/0.1.0-known-issues.md')
    def stableStartupMatrixRecord = layout.projectDirectory.file('docs/r19-stable-startup-matrix.md')
    def alpha1MigrationRecord = layout.projectDirectory.file('docs/r20-alpha1-world-migration.md')
    def workflowDirectory = layout.projectDirectory.dir('.github/workflows')
    inputs.files(buildWorkflow, releaseWorkflow, readme, readmeJa, changelog, alphaRelease, releaseNotes,
            publicationRecord, stableReadiness, stableKnownIssues, stableStartupMatrixRecord, alpha1MigrationRecord,
            stableGateDocument)
    inputs.dir(workflowDirectory)
    inputs.properties([
            mod_version       : mod_version,
            minecraft_version : minecraft_version,
            neo_version       : neo_version,
            create_version    : create_version,
            create_mod_version: create_mod_version,
            tfmg_version      : tfmg_version,
            spore_version     : spore_version,
            spore_file_id     : spore_file_id
    ])

    doLast {
        String buildYaml = buildWorkflow.asFile.getText('UTF-8')
        String releaseYaml = releaseWorkflow.asFile.getText('UTF-8')
        if (!(buildYaml =~ /(?m)^permissions:\s*\n  contents: read\s*$/)) {
            throw new GradleException('Build workflow must retain contents: read')
        }
        if (buildYaml.contains('contents: write')) {
            throw new GradleException('Build workflow must not receive contents: write')
        }
        [
                './gradlew stableStartupMatrix',
                'build/stable-startup-matrix/**/*.log',
                'build/stable-startup-matrix/*-results.properties'
        ].each { required ->
            if (!buildYaml.contains(required)) {
                throw new GradleException("Build workflow is missing Stable startup matrix integration: ${required}")
            }
        }
        [
                './gradlew alpha1WorldUpgradeSmoke --offline',
                'build/alpha1-world-upgrade/server/*.log',
                'build/alpha1-world-upgrade/alpha1-world-upgrade-results.properties'
        ].each { required ->
            if (!buildYaml.contains(required)) {
                throw new GradleException("Build workflow is missing Alpha migration integration: ${required}")
            }
        }
        if (buildYaml.indexOf('./gradlew alpha1WorldUpgradeSmoke --offline')
                < buildYaml.indexOf('./gradlew stableStartupMatrix')
                || buildYaml.indexOf('./gradlew alpha1WorldUpgradeSmoke --offline')
                > buildYaml.indexOf('./gradlew verifyReleaseCandidate')) {
            throw new GradleException('Alpha migration smoke must run after the startup matrix and before packaging')
        }
        if (buildYaml.contains('world-fixture.zip')) {
            throw new GradleException('Build workflow must not redundantly upload the committed migration fixture')
        }

        Set<String> writeEnabledWorkflows = workflowDirectory.asFile.listFiles()
                .findAll { it.isFile() && it.name.endsWith('.yml') && it.getText('UTF-8').contains('contents: write') }
                .collect { it.name }
                .toSet()
        if (writeEnabledWorkflows != ['release.yml'] as Set) {
            throw new GradleException("Only release.yml may receive contents: write: ${writeEnabledWorkflows.sort()}")
        }
        if (!(releaseYaml =~ /(?m)^on:\s*\n  push:\s*\n    tags:\s*\n      - 'v\*'\s*$/)) {
            throw new GradleException('Release workflow must be triggered by v* tag pushes')
        }
        if (!(releaseYaml =~ /(?m)^      - name: Read and classify release version\s*\n        id: release_metadata\s*$/)) {
            throw new GradleException('Release classification step must expose the release_metadata outputs')
        }
        [
                'fetch-tags: true',
                'test "$GITHUB_REF_NAME" = "v${mod_version}"',
                'test -f "$release_notes"',
                'git fetch --no-tags origin main:refs/remotes/origin/main',
                'git merge-base --is-ancestor "$GITHUB_SHA" origin/main',
                'gh release view "$GITHUB_REF_NAME"',
                'release_status="public_alpha_prerelease"',
                'release_status="public_stable_release"',
                'jar_name="frontier_protocol-${mod_version}.jar"',
                'checksum_name="${jar_name}.sha256"',
                'release_title="Frontier Protocol ${mod_version}"',
                'release_notes="docs/releases/${mod_version}.md"',
                'id: release_metadata',
                'printf \'is_prerelease=%s\\n\' "$is_prerelease" >> "$GITHUB_OUTPUT"',
                'printf \'release_status=%s\\n\' "$release_status" >> "$GITHUB_OUTPUT"',
                'printf \'jar_name=%s\\n\' "$jar_name" >> "$GITHUB_OUTPUT"',
                'printf \'checksum_name=%s\\n\' "$checksum_name" >> "$GITHUB_OUTPUT"',
                'printf \'release_title=%s\\n\' "$release_title" >> "$GITHUB_OUTPUT"',
                'printf \'release_notes=%s\\n\' "$release_notes" >> "$GITHUB_OUTPUT"',
                './gradlew verifyReleaseCandidate -PreleaseStatus="$RELEASE_STATUS"',
                "if: steps.release_metadata.outputs.is_prerelease == 'false'",
                './gradlew verifyStableReleaseGates',
                'release_args+=(--prerelease)',
                '--argjson prerelease "$IS_PRERELEASE"',
                '.prerelease == $prerelease and .draft == false',
                '--arg release_status "$RELEASE_STATUS"',
                '.release_status == $release_status'
        ].each { required ->
            if (!releaseYaml.contains(required)) {
                throw new GradleException("Release workflow is missing required validation: ${required}")
            }
        }
        if (releaseYaml.contains('--latest')) {
            throw new GradleException('Release workflow must not use --latest explicitly')
        }
        if (releaseYaml =~ /(?im)^\s*if:.*\benv(?:\.IS_PRERELEASE|\[['"]IS_PRERELEASE['"]\])/) {
            throw new GradleException('Stable gate control flow must not use a GITHUB_ENV runtime value')
        }
        if (releaseYaml.contains('0.1.0-alpha.1') || releaseYaml =~ /(?i)GITHUB_(HEAD_)?REF.*release_status/) {
            throw new GradleException('Executable release workflow must not hard-code alpha.1 or classify by branch')
        }
        [
                '"build/release/candidate/${JAR_NAME}"',
                '"build/release/candidate/${CHECKSUM_NAME}"',
                'build/release/candidate/release-manifest.json',
                'build/release/candidate/LICENSE',
                'https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${JAR_NAME}',
                '--arg name "$JAR_NAME"',
                '--arg name "$CHECKSUM_NAME"',
                'test "$jar_url" = "$expected_jar_url"',
                'test "$checksum_url" = "$expected_checksum_url"',
                'env -u GH_TOKEN -u GITHUB_TOKEN curl --fail --location',
                '--retry 5',
                '--retry-all-errors',
                '--retry-delay 2',
                'sha256sum --check "$CHECKSUM_NAME"',
                'cmp "build/release/candidate/$JAR_NAME" "$anonymous_dir/$JAR_NAME"',
                'gh release download "$GITHUB_REF_NAME"'
        ].each { required ->
            if (!releaseYaml.contains(required)) {
                throw new GradleException("Generic release asset contract is missing: ${required}")
            }
        }
        if (releaseYaml.contains('Authorization') || releaseYaml.contains('Accept:')) {
            throw new GradleException('Public asset downloads must not use authenticated GitHub headers')
        }

        Map<String, Map<String, Object>> classificationExamples = [
                '0.1.0-alpha.1': [status: 'public_alpha_prerelease', prerelease: true],
                '0.1.0-rc.1'   : [status: 'public_alpha_prerelease', prerelease: true],
                '0.1.0'        : [status: 'public_stable_release', prerelease: false]
        ]
        classificationExamples.each { version, expected ->
            if (classifyPublicRelease(version) != expected) {
                throw new GradleException("Release classification failed for ${version}")
            }
        }
        Map<String, Boolean> stableGateExamples = [
                '0.1.0-alpha.1': false,
                '0.1.0-rc.1'   : false,
                '0.1.0'        : true
        ]
        stableGateExamples.each { version, expectedToRun ->
            boolean runsStableGate = !classifyPublicRelease(version).prerelease
            if (runsStableGate != expectedToRun) {
                throw new GradleException("Stable gate control flow is incorrect for ${version}")
            }
        }
        Map<String, Map<String, String>> dynamicExamples = [
                '0.1.0-alpha.1': [
                        tag     : 'v0.1.0-alpha.1',
                        jar     : 'frontier_protocol-0.1.0-alpha.1.jar',
                        checksum: 'frontier_protocol-0.1.0-alpha.1.jar.sha256',
                        title   : 'Frontier Protocol 0.1.0-alpha.1',
                        notes   : 'docs/releases/0.1.0-alpha.1.md',
                        url     : 'https://github.com/upiscium/FrontierProtocol/releases/download/v0.1.0-alpha.1/frontier_protocol-0.1.0-alpha.1.jar'
                ],
                '0.1.0-rc.1': [
                        tag     : 'v0.1.0-rc.1',
                        jar     : 'frontier_protocol-0.1.0-rc.1.jar',
                        checksum: 'frontier_protocol-0.1.0-rc.1.jar.sha256',
                        title   : 'Frontier Protocol 0.1.0-rc.1',
                        notes   : 'docs/releases/0.1.0-rc.1.md',
                        url     : 'https://github.com/upiscium/FrontierProtocol/releases/download/v0.1.0-rc.1/frontier_protocol-0.1.0-rc.1.jar'
                ],
                '0.1.0': [
                        tag     : 'v0.1.0',
                        jar     : 'frontier_protocol-0.1.0.jar',
                        checksum: 'frontier_protocol-0.1.0.jar.sha256',
                        title   : 'Frontier Protocol 0.1.0',
                        notes   : 'docs/releases/0.1.0.md',
                        url     : 'https://github.com/upiscium/FrontierProtocol/releases/download/v0.1.0/frontier_protocol-0.1.0.jar'
                ]
        ]
        dynamicExamples.each { version, expected ->
            Map<String, String> actual = [
                    tag     : "v${version}",
                    jar     : "frontier_protocol-${version}.jar",
                    checksum: "frontier_protocol-${version}.jar.sha256",
                    title   : "Frontier Protocol ${version}",
                    notes   : "docs/releases/${version}.md",
                    url     : "https://github.com/upiscium/FrontierProtocol/releases/download/v${version}/frontier_protocol-${version}.jar"
            ]
            if (actual != expected) {
                throw new GradleException("Dynamic release values are incorrect for ${version}: ${actual}")
            }
        }
        ['1.0', '01.0.0', '0.1.0-', '0.1.0-01', 'v0.1.0', 'branch-main'].each { malformed ->
            try {
                classifyPublicRelease(malformed)
                throw new GradleException("Malformed version was accepted: ${malformed}")
            } catch (GradleException expected) {
                if (!expected.message.startsWith('Malformed or unsupported SemVer:')) throw expected
            }
        }

        Map<String, Object> pinned = inputs.properties
        Map<String, String> expectedVersions = [
                mod_version       : '0.1.0-alpha.1',
                minecraft_version : '1.21.1',
                neo_version       : '21.1.235',
                create_version    : '6.0.11-295',
                create_mod_version: '6.0.11',
                tfmg_version      : '1.2.0',
                spore_version     : '2.2.0j',
                spore_file_id     : '8342823'
        ]
        expectedVersions.each { propertyName, expectedValue ->
            if (pinned[propertyName].toString() != expectedValue) {
                throw new GradleException("${propertyName} must remain ${expectedValue}")
            }
        }
        if (supportedReleaseStatuses != [
                'internal_alpha_candidate',
                'public_alpha_prerelease',
                'public_stable_release'
        ] as Set
                || defaultReleaseStatus != 'internal_alpha_candidate') {
            throw new GradleException('Release status contract has changed')
        }

        String expectedUrl = 'https://github.com/upiscium/FrontierProtocol/releases/download/v0.1.0-alpha.1/frontier_protocol-0.1.0-alpha.1.jar'
        [readme, alphaRelease, releaseNotes].each { documentation ->
            String content = documentation.asFile.getText('UTF-8')
            if (!content.contains('v0.1.0-alpha.1')
                    || !content.contains('frontier_protocol-0.1.0-alpha.1.jar')
                    || !content.contains(expectedUrl)) {
                throw new GradleException("${documentation.asFile.name} lacks the immutable release URL contract")
            }
        }

        String readmeText = readme.asFile.getText('UTF-8')
        String readmeJaText = readmeJa.asFile.getText('UTF-8')
        def publicJarUrlPattern = ~/https:\/\/github\.com\/upiscium\/FrontierProtocol\/releases\/download\/[^\s"']+\/frontier_protocol-[^\s"']+\.jar/
        Set<String> readmeUrls = (readmeText =~ publicJarUrlPattern).collect { it.toString() }.toSet()
        Set<String> readmeJaUrls = (readmeJaText =~ publicJarUrlPattern).collect { it.toString() }.toSet()
        if (readmeUrls != [expectedUrl] as Set || readmeJaUrls != readmeUrls) {
            throw new GradleException('English and Japanese READMEs must retain the same immutable public JAR URL')
        }

        String alphaReleaseText = alphaRelease.asFile.getText('UTF-8')
        if (alphaReleaseText =~ /(?i)tag.{0,40}(is|are|remain|remains)\s+unset/
                || alphaReleaseText =~ /(?i)release date.{0,40}(is|are|remain|remains)\s+unset/) {
            throw new GradleException('Alpha release documentation must not claim the tag or release date is unset')
        }
        if (!alphaReleaseText.contains('2026-07-30')) {
            throw new GradleException('Alpha release documentation must retain the publication date')
        }

        String publicationText = publicationRecord.asFile.getText('UTF-8')
        [
                'Publication date: `2026-07-30`',
                'Source commit: `fed467ec0cd52a936f06751cd922efcc259914a1`',
                'GitHub release: public prerelease',
                'Draft: false',
                'Stable/latest-stable: false',
                'Release manifest status: `public_alpha_prerelease`',
                expectedUrl
        ].each { required ->
            if (!publicationText.contains(required)) {
                throw new GradleException("Publication record is missing required contract: ${required}")
            }
        }
        [
                'frontier_protocol-0.1.0-alpha.1.jar',
                'frontier_protocol-0.1.0-alpha.1.jar.sha256',
                'release-manifest.json',
                'LICENSE'
        ].each { assetName ->
            if (!publicationText.contains("- `${assetName}`")) {
                throw new GradleException("Publication record is missing release asset: ${assetName}")
            }
        }
        if (publicationText =~ /(?im)^- (Stable|Latest-stable):\s*(true|yes)\s*$/
                || publicationText =~ /(?i)\b(is|as)\s+a stable release\b/) {
            throw new GradleException('Publication record must not call the alpha a stable release')
        }
        if (!changelog.asFile.getText('UTF-8').contains('GitHub prerelease')) {
            throw new GradleException('Changelog must document GitHub prerelease distribution')
        }

        String readinessText = stableReadiness.asFile.getText('UTF-8')
        ['0.1.0-rc.1', 'public_stable_release', 'NOT VERIFIED', 'Blocker evidence audit',
         '0.1.0-alpha.1', 'Stable release sequence'].each { required ->
        if (!readinessText.contains(required)) {
                throw new GradleException("Stable readiness contract is missing: ${required}")
            }
        }
        String knownIssuesText = stableKnownIssues.asFile.getText('UTF-8')
        if (!knownIssuesText.contains('No issue is currently accepted')
                || !knownIssuesText.contains('NOT VERIFIED')) {
            throw new GradleException('Stable known-issues document must retain the blocker boundary')
        }
        String startupMatrixText = stableStartupMatrixRecord.asFile.getText('UTF-8')
        [
                'stableStartupMatrix',
                'freshWorldInitializationSmoke',
                'dependencyFailureSmoke',
                'serverConfigRecoverySmoke',
                '0.1.0-alpha.1',
                'real `0.1.0-alpha.1` world upgrade',
                'long-running RC log-volume soak'
        ].each { required ->
            if (!startupMatrixText.contains(required)) {
                throw new GradleException("Stable startup matrix record is missing: ${required}")
            }
        }
        String migrationText = alpha1MigrationRecord.asFile.getText('UTF-8')
        [
                'alpha1WorldUpgradeSmoke --offline',
                '60cb68f625eab26e8a37fe86eed125c52a1c00efca5dcae85ff3db5085274a8f',
                'fbb996b918c34a317bda9eb84a6d3d87bb836fc9e523b779ff1fdf5c780ae886',
                'alpha1-world-upgrade` Stable gate remains `INCOMPLETE',
                'long-running RC log-volume soak remains `NOT VERIFIED`'
        ].each { required ->
            if (!migrationText.contains(required)) {
                throw new GradleException("Alpha migration record is missing: ${required}")
            }
        }
        String stableGateText = stableGateDocument.asFile.getText('UTF-8')
        Map<String, String> stableGates = parseStableGates(stableGateText)
        if (stableGates.keySet() != requiredStableGateIds) {
            throw new GradleException('Stable gate document does not contain the exact required gate IDs')
        }
        if (!stableGates.values().contains('INCOMPLETE')) {
            throw new GradleException('Unexecuted stable gates must not be marked complete')
        }
        Set<String> workflowEnforced = stableGates.findAll { id, status -> status == 'WORKFLOW_ENFORCED' }.keySet()
        if (workflowEnforced != ['published-checksum', 'published-byte-identity'] as Set) {
            throw new GradleException('Post-publication workflow-enforced stable gates changed')
        }
        String packwizCandidateRow = stableGateText.readLines().find {
            it.startsWith('| packwiz-candidate-smoke |')
        }
        String expectedPackwizCandidateRow = '| packwiz-candidate-smoke | yes | INCOMPLETE | RC public URL or disposable local HTTP candidate add, refresh, metadata hash, and JAR structure |'
        if (packwizCandidateRow != expectedPackwizCandidateRow
                || packwizCandidateRow.contains('/releases/download/v0.1.0/')
                || packwizCandidateRow.toLowerCase(java.util.Locale.ROOT).contains('post-publication')) {
            throw new GradleException('Pre-publication packwiz gate must use candidate evidence available before release creation')
        }
        if (!stableGateText.contains('Status: **NOT PERFORMED**')
                || !stableGateText.contains('This is not a pre-publication gate')
                || !stableGateText.contains('https://github.com/upiscium/FrontierProtocol/releases/download/v0.1.0/frontier_protocol-0.1.0.jar')) {
            throw new GradleException('Post-publication stable packwiz verification contract is missing')
        }
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    dependsOn productionJar, verifyReleaseSafeguards
    systemProperty 'frontierProtocol.testJar', productionJarFile.get().asFile.absolutePath
    systemProperty 'frontierProtocol.projectDir', layout.projectDirectory.asFile.absolutePath
}

tasks.register('dedicatedServerSmoke') {
    group = 'verification'
    description = 'Starts the dedicated server, waits for readiness, and verifies a clean shutdown.'
    dependsOn 'createDedicatedServerSmokeRuntimeLaunchScript'
    timeout = java.time.Duration.ofMinutes(5)

    def smokeRoot = layout.buildDirectory.dir('dedicated-server-smoke')
    def serverDirectory = smokeRoot.map { it.dir('server') }
    def smokeLog = smokeRoot.map { it.file('dedicated-server.log') }
    def launchScript = layout.buildDirectory.file('moddev/runDedicatedServerSmokeRuntime.sh')
    inputs.file(launchScript)
    inputs.property('smoke_root', smokeRoot.map { it.asFile.absolutePath })
    inputs.property('server_directory', serverDirectory.map { it.asFile.absolutePath })
    inputs.property('smoke_log', smokeLog.map { it.asFile.absolutePath })
    inputs.property('startup_timeout_seconds', 180)
    inputs.property('shutdown_timeout_seconds', 60)
    outputs.file(smokeLog)
    outputs.upToDateWhen { false }

    doLast {
        Map<String, Object> smokeProperties = inputs.properties
        File rootDirectory = new File(smokeProperties.smoke_root.toString())
        File isolatedServerDirectory = new File(smokeProperties.server_directory.toString())
        File logFile = new File(smokeProperties.smoke_log.toString())
        int startupTimeoutSeconds = smokeProperties.startup_timeout_seconds as int
        int shutdownTimeoutSeconds = smokeProperties.shutdown_timeout_seconds as int
        File scriptFile = inputs.files.singleFile

        if (rootDirectory.exists() && !rootDirectory.deleteDir()) {
            throw new GradleException("Unable to clean dedicated-server smoke directory: ${rootDirectory}")
        }
        isolatedServerDirectory.mkdirs()
        logFile.parentFile.mkdirs()
        logFile.createNewFile()
        new File(isolatedServerDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')

        def ready = new java.util.concurrent.atomic.AtomicBoolean(false)
        def stopping = new java.util.concurrent.atomic.AtomicBoolean(false)
        def startupFailure = new java.util.concurrent.atomic.AtomicReference<String>()
        def readerFailure = new java.util.concurrent.atomic.AtomicReference<Throwable>()
        def tail = new java.util.ArrayDeque<String>(80)
        List<java.util.regex.Pattern> failurePatterns = [
                java.util.regex.Pattern.compile('(?i)---- Minecraft Crash Report ----'),
                java.util.regex.Pattern.compile('(?i)(Preparing|Saving|Saved).*crash report'),
                java.util.regex.Pattern.compile('(?i)Crash Report UUID|crash-reports/'),
                java.util.regex.Pattern.compile('(?i)Mixin apply .* failed|Mixin application failed'),
                java.util.regex.Pattern.compile('(?i)\\[mixin/ERROR]'),
                java.util.regex.Pattern.compile('(?i)org\\.spongepowered\\.asm\\.mixin\\.throwables'),
                java.util.regex.Pattern.compile('(?i)InjectionError'),
                java.util.regex.Pattern.compile('(?i)Missing or unsupported mandatory dependencies'),
                java.util.regex.Pattern.compile('(?i)Missing mandatory dependenc'),
                java.util.regex.Pattern.compile('(?i)Loading errors encountered'),
                java.util.regex.Pattern.compile('(?i)ModLoadingException'),
                java.util.regex.Pattern.compile('(?i)Attempted to load class .* for invalid dist DEDICATED_SERVER'),
                java.util.regex.Pattern.compile(
                        '(?i)(NoClassDefFoundError|ClassNotFoundException).*net[./]minecraft[./]client')
        ]

        Process process = null
        Thread outputThread = null
        Throwable smokeFailure = null
        try {
            process = new ProcessBuilder('/bin/sh', scriptFile.absolutePath)
                    .redirectErrorStream(true)
                    .start()
            Process runningProcess = process
            outputThread = Thread.startDaemon('dedicated-server-smoke-output') {
                try {
                    logFile.withWriter('UTF-8') { writer ->
                        runningProcess.inputStream.withReader('UTF-8') { reader ->
                            reader.eachLine { line ->
                                writer.write(line)
                                writer.write('\n')
                                writer.flush()
                                synchronized (tail) {
                                    if (tail.size() == 80) tail.removeFirst()
                                    tail.addLast(line)
                                }
                                if (line =~ /\bDone \([^)]+\)! For help, type "help"/) ready.set(true)
                                if (line.contains('Stopping server')) stopping.set(true)
                                if (failurePatterns.any { it.matcher(line).find() }) {
                                    startupFailure.compareAndSet(null, line)
                                }
                            }
                        }
                    }
                } catch (Throwable failure) {
                    readerFailure.set(failure)
                }
            }

            long startupDeadlineMillis = System.currentTimeMillis() + startupTimeoutSeconds * 1000L
            while (!ready.get()) {
                if (readerFailure.get() != null) throw readerFailure.get()
                if (startupFailure.get() != null) {
                    throw new GradleException("Dedicated server reported a startup failure: ${startupFailure.get()}")
                }
                if (!process.isAlive()) {
                    throw new GradleException("Dedicated server exited before readiness with status ${process.exitValue()}")
                }
                if (System.currentTimeMillis() >= startupDeadlineMillis) {
                    throw new GradleException(
                            "Dedicated server did not reach readiness within ${startupTimeoutSeconds} seconds")
                }
                Thread.sleep(100)
            }
            logger.lifecycle('Dedicated server reached the canonical Done ready state.')

            process.outputStream.write('stop\n'.getBytes(java.nio.charset.StandardCharsets.UTF_8))
            process.outputStream.flush()
            if (!process.waitFor(shutdownTimeoutSeconds, java.util.concurrent.TimeUnit.SECONDS)) {
                throw new GradleException(
                        "Dedicated server did not stop within ${shutdownTimeoutSeconds} seconds")
            }
            outputThread.join(java.util.concurrent.TimeUnit.SECONDS.toMillis(5))
            if (outputThread.isAlive()) throw new GradleException('Dedicated-server log reader did not terminate')
            if (readerFailure.get() != null) throw readerFailure.get()
            if (startupFailure.get() != null) {
                throw new GradleException("Dedicated server reported a failure: ${startupFailure.get()}")
            }
            if (!stopping.get()) throw new GradleException('Dedicated server did not acknowledge the stop command')
            if (process.exitValue() != 0) {
                throw new GradleException("Dedicated server exited with status ${process.exitValue()}")
            }
            logger.lifecycle('Dedicated server accepted stop and exited with status 0.')
        } catch (Throwable failure) {
            smokeFailure = failure
        } finally {
            boolean cleanupInterrupted = false
            if (process != null && process.isAlive()) {
                List<ProcessHandle> descendants = process.toHandle().descendants().toList().reverse()
                descendants.each { it.destroy() }
                process.destroy()
                try {
                    process.waitFor(5, java.util.concurrent.TimeUnit.SECONDS)
                } catch (InterruptedException ignored) {
                    cleanupInterrupted = true
                }
                descendants.findAll { it.isAlive() }.each { it.destroyForcibly() }
                if (process.isAlive()) process.destroyForcibly()
                try {
                    process.waitFor(5, java.util.concurrent.TimeUnit.SECONDS)
                } catch (InterruptedException ignored) {
                    cleanupInterrupted = true
                }
            }
            if (outputThread != null) {
                try {
                    outputThread.join(java.util.concurrent.TimeUnit.SECONDS.toMillis(5))
                } catch (InterruptedException ignored) {
                    cleanupInterrupted = true
                }
            }
            if (cleanupInterrupted) Thread.currentThread().interrupt()
        }

        if (smokeFailure != null) {
            logger.error("Dedicated-server smoke failure: ${smokeFailure.message}")
            logger.error("Dedicated-server smoke log tail (${logFile}):")
            synchronized (tail) { tail.each { logger.error(it) } }
            throw new GradleException("Dedicated-server smoke failed; retained log: ${logFile}", smokeFailure)
        }
        logger.lifecycle("Dedicated-server smoke log retained at: ${logFile}")
    }
}

def stableStartupMatrixRoot = layout.buildDirectory.dir('stable-startup-matrix')
def stableStartupMatrixClasspathArgs = layout.buildDirectory.file(
        'moddev/dedicatedServerSmokeRuntimeRunClasspath.txt')
def stableStartupMatrixVmArgs = layout.buildDirectory.file(
        'moddev/dedicatedServerSmokeRuntimeRunVmArgs.txt')
def stableStartupMatrixProgramArgs = layout.buildDirectory.file(
        'moddev/dedicatedServerSmokeRuntimeRunProgramArgs.txt')
def stableStartupMatrixJava = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}
def registerStableStartupScenario = { String taskName, String scenario, String taskDescription ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = taskDescription
        dependsOn tasks.named('testClasses'), productionJar, tasks.named('createDedicatedServerSmokeRuntimeLaunchScript')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'dev.upiscium.frontierprotocol.startup.StableStartupMatrix'
        javaLauncher = stableStartupMatrixJava
        timeout = java.time.Duration.ofMinutes(10)
        inputs.files(
                stableStartupMatrixClasspathArgs,
                stableStartupMatrixVmArgs,
                stableStartupMatrixProgramArgs,
                productionJarFile)
        inputs.property('scenario', scenario)
        outputs.file(stableStartupMatrixRoot.map { it.file("${scenario}-results.properties") })
        outputs.upToDateWhen { false }

        doFirst {
            args = [
                    '--scenario', scenario,
                    '--root', stableStartupMatrixRoot.get().asFile.absolutePath,
                    '--java', stableStartupMatrixJava.get().executablePath.asFile.absolutePath,
                    '--classpath-args', stableStartupMatrixClasspathArgs.get().asFile.absolutePath,
                    '--vm-args', stableStartupMatrixVmArgs.get().asFile.absolutePath,
                    '--program-args', stableStartupMatrixProgramArgs.get().asFile.absolutePath,
                    '--production-jar', productionJarFile.get().asFile.absolutePath
            ]
        }
    }
}

def freshWorldInitializationSmoke = registerStableStartupScenario(
        'freshWorldInitializationSmoke',
        'fresh',
        'Starts one fresh world twice and verifies its persisted initial-spawn center.')
def dependencyFailureSmoke = registerStableStartupScenario(
        'dependencyFailureSmoke',
        'dependencies',
        'Verifies actionable loader diagnostics for each omitted required dependency.')
def serverConfigRecoverySmoke = registerStableStartupScenario(
        'serverConfigRecoverySmoke',
        'config',
        'Verifies malformed and out-of-range server config handling and recovery.')
dependencyFailureSmoke.configure { mustRunAfter freshWorldInitializationSmoke }
serverConfigRecoverySmoke.configure { mustRunAfter dependencyFailureSmoke }

tasks.register('stableStartupMatrix') {
    group = 'verification'
    description = 'Runs the isolated Stable dedicated-server startup and recovery matrix.'
    dependsOn freshWorldInitializationSmoke, dependencyFailureSmoke, serverConfigRecoverySmoke
}

def alpha1FixtureDirectory = layout.projectDirectory.dir('src/test/resources/migration/0.1.0-alpha.1')
def alpha1FixtureGenerationRoot = layout.buildDirectory.dir('alpha1-fixture-generation')
def alpha1WorldUpgradeRoot = layout.buildDirectory.dir('alpha1-world-upgrade')
def alpha1DownloadDirectory = layout.buildDirectory.dir('alpha1-fixture-downloads')
def alpha1JarFilename = 'frontier_protocol-0.1.0-alpha.1.jar'
def alpha1JarSha256 = '60cb68f625eab26e8a37fe86eed125c52a1c00efca5dcae85ff3db5085274a8f'
def alpha1JarUrl = "https://github.com/upiscium/FrontierProtocol/releases/download/v0.1.0-alpha.1/${alpha1JarFilename}"
def alpha1ChecksumUrl = "${alpha1JarUrl}.sha256"
def allowAlpha1FixtureNetwork = providers.gradleProperty('allowAlpha1FixtureNetwork')
def promoteAlpha1Fixture = providers.gradleProperty('promoteAlpha1Fixture')

def downloadAlpha1MigrationAssets = tasks.register('downloadAlpha1MigrationAssets') {
    group = 'fixture generation'
    description = 'Explicitly downloads and verifies immutable Alpha fixture-generation assets.'
    outputs.files(
            alpha1DownloadDirectory.map { it.file(alpha1JarFilename) },
            alpha1DownloadDirectory.map { it.file("${alpha1JarFilename}.sha256") })
    outputs.upToDateWhen { false }

    doLast {
        if (allowAlpha1FixtureNetwork.orNull != 'true') {
            throw new GradleException(
                    'Alpha fixture download is disabled; rerun with -PallowAlpha1FixtureNetwork=true')
        }
        File directory = alpha1DownloadDirectory.get().asFile
        directory.mkdirs()
        File jar = new File(directory, alpha1JarFilename)
        File checksum = new File(directory, "${alpha1JarFilename}.sha256")
        new URI(alpha1JarUrl).toURL().withInputStream { input -> jar.withOutputStream { input.transferTo(it) } }
        new URI(alpha1ChecksumUrl).toURL().withInputStream { input -> checksum.withOutputStream { input.transferTo(it) } }
        String checksumText = checksum.getText('UTF-8').trim()
        if (checksumText != "${alpha1JarSha256}  ${alpha1JarFilename}") {
            throw new GradleException('Published Alpha checksum asset differs from the pinned provenance')
        }
        String actual = java.security.MessageDigest.getInstance('SHA-256')
                .digest(java.nio.file.Files.readAllBytes(jar.toPath())).encodeHex().toString()
        if (actual != alpha1JarSha256) throw new GradleException('Published Alpha JAR checksum verification failed')
    }
}

def configureAlpha1MigrationJavaExec = { JavaExec task, String mode, Provider<Directory> root ->
    task.classpath = sourceSets.test.runtimeClasspath
    task.mainClass = 'dev.upiscium.frontierprotocol.migration.Alpha1WorldMigration'
    task.javaLauncher = stableStartupMatrixJava
    task.timeout = java.time.Duration.ofMinutes(10)
    task.doFirst {
        task.args = [
                '--mode', mode,
                '--root', root.get().asFile.absolutePath,
                '--java', stableStartupMatrixJava.get().executablePath.asFile.absolutePath,
                '--classpath-args', stableStartupMatrixClasspathArgs.get().asFile.absolutePath,
                '--vm-args', stableStartupMatrixVmArgs.get().asFile.absolutePath,
                '--program-args', stableStartupMatrixProgramArgs.get().asFile.absolutePath,
                '--production-jar', productionJarFile.get().asFile.absolutePath
        ]
    }
}

tasks.register('generateAlpha1MigrationFixture', JavaExec) { task ->
    group = 'fixture generation'
    description = 'Network-enabled explicit generation of the twice-Alpha-round-tripped world fixture.'
    dependsOn downloadAlpha1MigrationAssets, fixtureBuilderJar, tasks.named('testClasses'), productionJar,
            tasks.named('createDedicatedServerSmokeRuntimeLaunchScript')
    outputs.dir(alpha1FixtureGenerationRoot.map { it.dir('promotable') })
    outputs.upToDateWhen { false }
    doFirst {
        args += [
                '--alpha-jar', alpha1DownloadDirectory.get().file(alpha1JarFilename).asFile.absolutePath,
                '--fixture-builder-jar', fixtureBuilderJarFile.get().asFile.absolutePath
        ]
    }
    configureAlpha1MigrationJavaExec(task, 'generate', alpha1FixtureGenerationRoot)
}

tasks.register('promoteAlpha1MigrationFixture') {
    group = 'fixture generation'
    description = 'Explicitly promotes already-generated fixture files into tracked test resources.'
    doLast {
        if (promoteAlpha1Fixture.orNull != 'true') {
            throw new GradleException('Fixture promotion is disabled; rerun with -PpromoteAlpha1Fixture=true')
        }
        File source = alpha1FixtureGenerationRoot.get().dir('promotable').asFile
        File destination = alpha1FixtureDirectory.asFile
        ['world-fixture.zip', 'fixture-manifest.json', 'fixture-manifest.sha256'].each { name ->
            File input = new File(source, name)
            if (!input.isFile()) throw new GradleException("Generated fixture is missing ${name}")
        }
        destination.mkdirs()
        ['world-fixture.zip', 'fixture-manifest.json', 'fixture-manifest.sha256'].each { name ->
            java.nio.file.Files.copy(
                    new File(source, name).toPath(),
                    new File(destination, name).toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

tasks.register('alpha1WorldUpgradeSmoke', JavaExec) { task ->
    group = 'verification'
    description = 'Offline verification of the committed Alpha world through two current-candidate starts.'
    dependsOn tasks.named('testClasses'), productionJar, tasks.named('createDedicatedServerSmokeRuntimeLaunchScript')
    mustRunAfter tasks.named('stableStartupMatrix')
    inputs.files(
            alpha1FixtureDirectory.file('world-fixture.zip'),
            alpha1FixtureDirectory.file('fixture-manifest.json'),
            alpha1FixtureDirectory.file('fixture-manifest.sha256'),
            stableStartupMatrixClasspathArgs,
            stableStartupMatrixVmArgs,
            stableStartupMatrixProgramArgs,
            productionJarFile)
    outputs.file(alpha1WorldUpgradeRoot.map { it.file('alpha1-world-upgrade-results.properties') })
    outputs.upToDateWhen { false }
    doFirst {
        args += ['--fixture-directory', alpha1FixtureDirectory.asFile.absolutePath]
    }
    configureAlpha1MigrationJavaExec(task, 'verify', alpha1WorldUpgradeRoot)
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
             mod_version            : mod_version,
            create_version         : create_version,
            create_mod_version     : create_mod_version,
            spore_version          : spore_version,
            tfmg_version           : tfmg_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

