plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("**/.cache") // datagen cache directories
    exclude("**/.cache/**") // datagen cache contents
}

def generatedGameTestResources = layout.buildDirectory.dir('generated/gametestResources')
def createGameTestJar = configurations.compileClasspath.elements.map { files ->
    def artifact = files.find { it.asFile.name.startsWith('create-1.21.1-') }
    if (artifact == null) throw new GradleException('Create jar not found for GameTest structure generation')
    artifact.asFile
}
tasks.register('generateGameTestStructure') {
    inputs.file(createGameTestJar)
    outputs.dir(generatedGameTestResources)
    doLast {
        def output = generatedGameTestResources.get().file('data/frontier_protocol/structure/empty.nbt').asFile
        output.parentFile.mkdirs()
        output.withOutputStream { raw ->
            new java.util.zip.GZIPOutputStream(raw).withCloseable { gzip ->
                new DataOutputStream(gzip).withCloseable { nbt ->
                    nbt.writeByte(10); nbt.writeUTF('')
                    nbt.writeByte(3); nbt.writeUTF('DataVersion'); nbt.writeInt(3955)
                    nbt.writeByte(9); nbt.writeUTF('size'); nbt.writeByte(3); nbt.writeInt(3)
                    nbt.writeInt(1); nbt.writeInt(1); nbt.writeInt(1)
                    ['palette', 'blocks', 'entities'].each { name ->
                        nbt.writeByte(9); nbt.writeUTF(name); nbt.writeByte(10); nbt.writeInt(0)
                    }
                    nbt.writeByte(0)
                }
            }
        }

        def physicalMixing = generatedGameTestResources.get()
                .file('data/frontier_protocol/structure/r9_unheated_mixing.nbt').asFile
        physicalMixing.parentFile.mkdirs()
        new java.util.zip.ZipFile(createGameTestJar.get()).withCloseable { zip ->
            def entry = zip.getEntry('data/create/structure/gametest/processing/brass_mixing.nbt')
            if (entry == null) throw new GradleException('Create physical mixing GameTest structure not found')
            zip.getInputStream(entry).withCloseable { input ->
                physicalMixing.withOutputStream { outputStream -> input.transferTo(outputStream) }
            }
        }
    }
}
sourceSets.main.resources.srcDir(generatedGameTestResources)
tasks.named('processResources').configure { dependsOn('generateGameTestStructure') }

repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.tterrag.com' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.blamejared.com' }
    exclusiveContent {
        forRepository {
            maven { url = 'https://cursemaven.com' }
        }
        filter { includeGroup 'curse.maven' }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        dedicatedServerSmokeRuntime {
            server()
            gameDirectory = layout.buildDirectory.dir('dedicated-server-smoke/server').get().asFile
            programArgument '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods.frontier_protocol
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "com.simibubi.create:create-${minecraft_version}:${create_version}"
    implementation "curse.maven:fungal-infection-spore-678295:${spore_file_id}"
    implementation "maven.modrinth:create-tfmg:${tfmg_version}"

    if (project.hasProperty('enableOptionalCompatRuntime')) {
        localRuntime "maven.modrinth:sable:${sable_version}"
        localRuntime "maven.modrinth:create-aeronautics:${aeronautics_version}"
    }

    if (project.hasProperty('enableRecipeViewerRuntime')) {
        localRuntime "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    }

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

def productionJar = tasks.named('jar', Jar)
def productionJarFile = productionJar.flatMap { it.archiveFile }
def releaseRoot = layout.buildDirectory.dir('release')
def releaseMetadataDir = layout.buildDirectory.dir('release/metadata')
def releaseCandidateDir = layout.buildDirectory.dir('release/candidate')
def releaseChecksum = productionJarFile.flatMap { jar ->
    releaseMetadataDir.map { directory -> directory.file("${jar.asFile.name}.sha256") }
}
def releaseManifest = releaseMetadataDir.map { it.file('release-manifest.json') }
def localGitCommit = providers.exec {
    commandLine 'git', 'rev-parse', 'HEAD'
}.standardOutput.asText.map { it.trim() }
def sourceCommit = providers.environmentVariable('GITHUB_SHA').orElse(localGitCommit)
def releaseJavaVersion = java.toolchain.languageVersion.get().asInt().toString()

def verifyReleaseJar = tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Verifies production JAR contents and expanded mod metadata.'
    dependsOn productionJar
    inputs.file(productionJarFile)
    inputs.properties([
            mod_id                 : mod_id,
            mod_version            : mod_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            create_mod_version     : create_mod_version,
            tfmg_version           : tfmg_version,
            spore_version          : spore_version
    ])

    doLast {
        Map<String, Object> releaseProperties = inputs.properties
        File jarFile = inputs.files.singleFile
        new java.util.zip.ZipFile(jarFile).withCloseable { jar ->
            Set<String> entries = jar.entries().collect { it.name }.toSet()
            Set<String> requiredEntries = [
                    'META-INF/neoforge.mods.toml',
                    'frontier_protocol.mixins.json',
                    'assets/frontier_protocol/lang/en_us.json',
                    'assets/frontier_protocol/lang/ja_jp.json',
                    'assets/frontier_protocol/models/block/stabilizer_casing_machine.json',
                    'assets/frontier_protocol/models/item/stabilization_compound.json',
                    'assets/frontier_protocol/models/item/stabilization_cell.json',
                    'assets/frontier_protocol/textures/item/stabilization_compound.png',
                    'assets/frontier_protocol/textures/item/stabilization_cell.png',
                    'dev/upiscium/frontierprotocol/FrontierProtocolMod.class'
            ]
            (1..3).each { tier ->
                requiredEntries.add("assets/frontier_protocol/blockstates/tier_${tier}_stabilizer.json")
                requiredEntries.add("assets/frontier_protocol/models/item/tier_${tier}_stabilizer.json")
                ['offline', 'active', 'grace_period'].each { status ->
                    requiredEntries.add(
                            "assets/frontier_protocol/models/block/tier_${tier}_stabilizer_${status}.json")
                }
                ['front', 'back', 'side', 'top_offline', 'top_active', 'top_grace'].each { texture ->
                    requiredEntries.add(
                            "assets/frontier_protocol/textures/block/tier_${tier}_stabilizer_${texture}.png")
                }
            }
            Set<String> missing = requiredEntries - entries
            if (!missing.isEmpty()) throw new GradleException("Production JAR is missing entries: ${missing.sort()}")

            [
                    'dev/upiscium/frontierprotocol/stabilizer/',
                    'dev/upiscium/frontierprotocol/suppression/',
                    'dev/upiscium/frontierprotocol/cleanup/',
                    'dev/upiscium/frontierprotocol/mixin/'
            ].each { prefix ->
                if (!entries.any { it.startsWith(prefix) && it.endsWith('.class') }) {
                    throw new GradleException("Production JAR is missing classes under ${prefix}")
                }
            }

            Set<String> forbiddenExact = [
                    'assets/frontier_protocol/models/block/tier_1_stabilizer_core.json',
                    'assets/frontier_protocol/models/block/tier_1_stabilizer_gear.json'
            ]
            List<String> forbiddenPrefixes = [
                    'src/', 'run/', 'run-data/', '.gradle/', '.git/',
                    'net/minecraft/', 'net/neoforged/',
                    'com/simibubi/create/', 'com/Harbinger/Spore/', 'com/drmangotea/tfmg/'
            ]
            Set<String> forbidden = entries.findAll { entry ->
                forbiddenExact.contains(entry)
                        || forbiddenPrefixes.any { entry.startsWith(it) }
                        || entry.endsWith('.bbmodel')
                        || entry == '.cache'
                        || entry.startsWith('.cache/')
                        || entry.endsWith('/.cache')
                        || entry.contains('/.cache/')
                        || entry.endsWith('.jar')
            }
            if (!forbidden.isEmpty()) {
                throw new GradleException("Production JAR contains forbidden entries: ${forbidden.sort()}")
            }

            String metadata = jar.getInputStream(jar.getEntry('META-INF/neoforge.mods.toml'))
                    .getText(java.nio.charset.StandardCharsets.UTF_8.name())
            if (metadata.contains('${')) throw new GradleException('Production metadata contains an unexpanded template')
            [
                    "modId=\"${releaseProperties.mod_id}\"",
                    "version=\"${releaseProperties.mod_version}\"",
                    "versionRange=\"${releaseProperties.minecraft_version_range}\"",
                    "versionRange=\"[${releaseProperties.neo_version},)\"",
                    "versionRange=\"[${releaseProperties.create_mod_version},)\"",
                    "versionRange=\"[${releaseProperties.tfmg_version},)\"",
                    "versionRange=\"[${releaseProperties.spore_version}]\""
            ].each { expected ->
                if (!metadata.contains(expected)) {
                    throw new GradleException("Production metadata is missing ${expected}")
                }
            }
            List<String> dependencyBlocks = metadata.split(
                    java.util.regex.Pattern.quote("[[dependencies.${releaseProperties.mod_id}]]"))
                    .drop(1)
            ['neoforge', 'minecraft', 'create', 'tfmg', 'spore'].each { dependency ->
                String dependencyBlock = dependencyBlocks.find { block ->
                    block.contains("modId=\"${dependency}\"")
                }
                if (dependencyBlock == null
                        || !dependencyBlock.contains('type="required"')
                        || !dependencyBlock.contains('side="BOTH"')) {
                    throw new GradleException("Production metadata does not require ${dependency} on BOTH sides")
                }
            }

            byte[] mainClass = jar.getInputStream(
                    jar.getEntry('dev/upiscium/frontierprotocol/FrontierProtocolMod.class')).readAllBytes()
            int classMajorVersion = ((mainClass[6] & 0xFF) << 8) | (mainClass[7] & 0xFF)
            if (classMajorVersion != 65) {
                throw new GradleException("Production classes do not target Java 21: major=${classMajorVersion}")
            }
        }
    }
}

def generateReleaseChecksum = tasks.register('generateReleaseChecksum') {
    group = 'build'
    description = 'Generates the production JAR SHA-256 checksum.'
    dependsOn verifyReleaseJar
    inputs.file(productionJarFile)
    outputs.file(releaseChecksum)

    doLast {
        File jarFile = inputs.files.singleFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        jarFile.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int count
            while ((count = input.read(buffer)) >= 0) {
                if (count > 0) digest.update(buffer, 0, count)
            }
        }
        File checksumFile = outputs.files.singleFile
        checksumFile.parentFile.mkdirs()
        checksumFile.setText("${digest.digest().encodeHex()}  ${jarFile.name}\n", 'UTF-8')
    }
}

def generateReleaseManifest = tasks.register('generateReleaseManifest') {
    group = 'build'
    description = 'Generates the reproducible release manifest.'
    dependsOn generateReleaseChecksum
    inputs.files(productionJarFile, releaseChecksum)
    inputs.property('source_commit', sourceCommit)
    inputs.properties([
            mod_id            : mod_id,
            mod_name          : mod_name,
            mod_version       : mod_version,
            minecraft_version : minecraft_version,
            java_version      : releaseJavaVersion,
            neo_version       : neo_version,
            create_version    : create_version,
            create_mod_version: create_mod_version,
            tfmg_version      : tfmg_version,
            spore_version     : spore_version,
            spore_file_id     : spore_file_id
    ])
    outputs.file(releaseManifest)

    doLast {
        Map<String, Object> releaseProperties = inputs.properties
        String commit = releaseProperties.source_commit.toString().trim()
        if (!(commit ==~ /[0-9a-fA-F]{40}/)) {
            throw new GradleException("Unable to resolve a full Git commit SHA: '${commit}'")
        }
        File jarFile = inputs.files.files.find { it.name.endsWith('.jar') }
        File checksumFile = inputs.files.files.find { it.name.endsWith('.jar.sha256') }
        String checksum = checksumFile.getText('UTF-8').tokenize().first()
        Map<String, Object> manifest = [
                schema_version: 1,
                release_status: 'internal_alpha_candidate',
                mod           : [
                        id     : releaseProperties.mod_id,
                        name   : releaseProperties.mod_name,
                        version: releaseProperties.mod_version
                ],
                source        : [git_commit: commit.toLowerCase(java.util.Locale.ROOT)],
                platform      : [
                        minecraft: releaseProperties.minecraft_version,
                        java     : releaseProperties.java_version,
                        neoforge : releaseProperties.neo_version
                ],
                dependencies  : [
                        create_artifact: releaseProperties.create_version,
                        create_mod     : releaseProperties.create_mod_version,
                        tfmg           : releaseProperties.tfmg_version,
                        spore          : releaseProperties.spore_version,
                        spore_file_id  : releaseProperties.spore_file_id
                ],
                artifact      : [filename: jarFile.name, sha256: checksum]
        ]
        File manifestFile = outputs.files.singleFile
        manifestFile.parentFile.mkdirs()
        manifestFile.setText(
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)) + '\n',
                'UTF-8')
    }
}

def assembleReleaseCandidate = tasks.register('assembleReleaseCandidate', Sync) {
    group = 'build'
    description = 'Assembles the verified three-file Release Candidate bundle.'
    dependsOn productionJar, generateReleaseChecksum, generateReleaseManifest
    inputs.property('jar_name', productionJarFile.map { it.asFile.name })
    into releaseCandidateDir
    from productionJarFile
    from releaseChecksum
    from releaseManifest

    doLast {
        File candidateDirectory = outputs.files.singleFile
        String jarName = inputs.properties.jar_name
        Set<String> expected = [jarName, "${jarName}.sha256", 'release-manifest.json']
        Set<String> actual = candidateDirectory.listFiles().findAll { it.isFile() }.collect { it.name }.toSet()
        if (actual != expected || candidateDirectory.listFiles().any { it.isDirectory() }) {
            throw new GradleException("Unexpected Release Candidate contents: ${actual.sort()}")
        }
    }
}

tasks.register('verifyReleaseCandidate') {
    group = 'verification'
    description = 'Verifies the candidate checksum, manifest, and exact file set.'
    dependsOn assembleReleaseCandidate
    inputs.dir(releaseCandidateDir)
    inputs.property('candidate_directory', releaseCandidateDir.map { it.asFile.absolutePath })
    inputs.property('jar_name', productionJarFile.map { it.asFile.name })
    inputs.properties([
            mod_id            : mod_id,
            mod_name          : mod_name,
            mod_version       : mod_version,
            minecraft_version : minecraft_version,
            java_version      : releaseJavaVersion,
            neo_version       : neo_version,
            create_version    : create_version,
            create_mod_version: create_mod_version,
            tfmg_version      : tfmg_version,
            spore_version     : spore_version,
            spore_file_id     : spore_file_id
    ])

    doLast {
        Map<String, Object> releaseProperties = inputs.properties
        File candidateDirectory = new File(releaseProperties.candidate_directory.toString())
        String jarName = releaseProperties.jar_name
        Set<String> expected = [jarName, "${jarName}.sha256", 'release-manifest.json']
        Set<String> actual = candidateDirectory.listFiles().findAll { it.isFile() }.collect { it.name }.toSet()
        if (actual != expected || candidateDirectory.listFiles().any { it.isDirectory() }) {
            throw new GradleException("Unexpected Release Candidate contents: ${actual.sort()}")
        }

        File jarFile = new File(candidateDirectory, jarName)
        File checksumFile = new File(candidateDirectory, "${jarName}.sha256")
        def checksumMatch = checksumFile.getText('UTF-8') =~ /^([0-9a-f]{64})  (.+)\n$/
        if (!checksumMatch.matches() || checksumMatch.group(2) != jarName) {
            throw new GradleException('Release checksum has an invalid format or JAR filename')
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        jarFile.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int count
            while ((count = input.read(buffer)) >= 0) {
                if (count > 0) digest.update(buffer, 0, count)
            }
        }
        String checksum = digest.digest().encodeHex().toString()
        if (checksum != checksumMatch.group(1)) throw new GradleException('Release checksum does not match the JAR')

        Map<String, Object> manifest = new groovy.json.JsonSlurper().parse(
                new File(candidateDirectory, 'release-manifest.json'))
        if (manifest.schema_version != 1 || manifest.release_status != 'internal_alpha_candidate'
                || manifest.mod.id != releaseProperties.mod_id
                || manifest.mod.name != releaseProperties.mod_name
                || manifest.mod.version != releaseProperties.mod_version
                || manifest.platform.minecraft != releaseProperties.minecraft_version
                || manifest.platform.java != releaseProperties.java_version
                || manifest.platform.neoforge != releaseProperties.neo_version
                || manifest.dependencies.create_artifact != releaseProperties.create_version
                || manifest.dependencies.create_mod != releaseProperties.create_mod_version
                || manifest.dependencies.tfmg != releaseProperties.tfmg_version
                || manifest.dependencies.spore != releaseProperties.spore_version
                || manifest.dependencies.spore_file_id != releaseProperties.spore_file_id
                || manifest.artifact.filename != jarName
                || manifest.artifact.sha256 != checksum) {
            throw new GradleException('Release manifest does not match the candidate or Gradle properties')
        }
        if (!(manifest.source.git_commit ==~ /[0-9a-fA-F]{40}/)) {
            throw new GradleException('Release manifest does not contain a full Git commit SHA')
        }
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    dependsOn productionJar
    systemProperty 'frontierProtocol.testJar', productionJarFile.get().asFile.absolutePath
}

tasks.register('dedicatedServerSmoke') {
    group = 'verification'
    description = 'Starts the dedicated server, waits for readiness, and verifies a clean shutdown.'
    dependsOn 'createDedicatedServerSmokeRuntimeLaunchScript'
    timeout = java.time.Duration.ofMinutes(5)

    def smokeRoot = layout.buildDirectory.dir('dedicated-server-smoke')
    def serverDirectory = smokeRoot.map { it.dir('server') }
    def smokeLog = smokeRoot.map { it.file('dedicated-server.log') }
    def launchScript = layout.buildDirectory.file('moddev/runDedicatedServerSmokeRuntime.sh')
    inputs.file(launchScript)
    inputs.property('smoke_root', smokeRoot.map { it.asFile.absolutePath })
    inputs.property('server_directory', serverDirectory.map { it.asFile.absolutePath })
    inputs.property('smoke_log', smokeLog.map { it.asFile.absolutePath })
    inputs.property('startup_timeout_seconds', 180)
    inputs.property('shutdown_timeout_seconds', 60)
    outputs.file(smokeLog)
    outputs.upToDateWhen { false }

    doLast {
        Map<String, Object> smokeProperties = inputs.properties
        File rootDirectory = new File(smokeProperties.smoke_root.toString())
        File isolatedServerDirectory = new File(smokeProperties.server_directory.toString())
        File logFile = new File(smokeProperties.smoke_log.toString())
        int startupTimeoutSeconds = smokeProperties.startup_timeout_seconds as int
        int shutdownTimeoutSeconds = smokeProperties.shutdown_timeout_seconds as int
        File scriptFile = inputs.files.singleFile

        if (rootDirectory.exists() && !rootDirectory.deleteDir()) {
            throw new GradleException("Unable to clean dedicated-server smoke directory: ${rootDirectory}")
        }
        isolatedServerDirectory.mkdirs()
        logFile.parentFile.mkdirs()
        logFile.createNewFile()
        new File(isolatedServerDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')

        def ready = new java.util.concurrent.atomic.AtomicBoolean(false)
        def stopping = new java.util.concurrent.atomic.AtomicBoolean(false)
        def startupFailure = new java.util.concurrent.atomic.AtomicReference<String>()
        def readerFailure = new java.util.concurrent.atomic.AtomicReference<Throwable>()
        def tail = new java.util.ArrayDeque<String>(80)
        List<java.util.regex.Pattern> failurePatterns = [
                java.util.regex.Pattern.compile('(?i)---- Minecraft Crash Report ----'),
                java.util.regex.Pattern.compile('(?i)(Preparing|Saving|Saved).*crash report'),
                java.util.regex.Pattern.compile('(?i)Crash Report UUID|crash-reports/'),
                java.util.regex.Pattern.compile('(?i)Mixin apply .* failed|Mixin application failed'),
                java.util.regex.Pattern.compile('(?i)\\[mixin/ERROR]'),
                java.util.regex.Pattern.compile('(?i)org\\.spongepowered\\.asm\\.mixin\\.throwables'),
                java.util.regex.Pattern.compile('(?i)InjectionError'),
                java.util.regex.Pattern.compile('(?i)Missing or unsupported mandatory dependencies'),
                java.util.regex.Pattern.compile('(?i)Missing mandatory dependenc'),
                java.util.regex.Pattern.compile('(?i)Loading errors encountered'),
                java.util.regex.Pattern.compile('(?i)ModLoadingException'),
                java.util.regex.Pattern.compile('(?i)Attempted to load class .* for invalid dist DEDICATED_SERVER'),
                java.util.regex.Pattern.compile(
                        '(?i)(NoClassDefFoundError|ClassNotFoundException).*net[./]minecraft[./]client')
        ]

        Process process = null
        Thread outputThread = null
        Throwable smokeFailure = null
        try {
            process = new ProcessBuilder('/bin/sh', scriptFile.absolutePath)
                    .redirectErrorStream(true)
                    .start()
            Process runningProcess = process
            outputThread = Thread.startDaemon('dedicated-server-smoke-output') {
                try {
                    logFile.withWriter('UTF-8') { writer ->
                        runningProcess.inputStream.withReader('UTF-8') { reader ->
                            reader.eachLine { line ->
                                writer.write(line)
                                writer.write('\n')
                                writer.flush()
                                synchronized (tail) {
                                    if (tail.size() == 80) tail.removeFirst()
                                    tail.addLast(line)
                                }
                                if (line =~ /\bDone \([^)]+\)! For help, type "help"/) ready.set(true)
                                if (line.contains('Stopping server')) stopping.set(true)
                                if (failurePatterns.any { it.matcher(line).find() }) {
                                    startupFailure.compareAndSet(null, line)
                                }
                            }
                        }
                    }
                } catch (Throwable failure) {
                    readerFailure.set(failure)
                }
            }

            long startupDeadlineMillis = System.currentTimeMillis() + startupTimeoutSeconds * 1000L
            while (!ready.get()) {
                if (readerFailure.get() != null) throw readerFailure.get()
                if (startupFailure.get() != null) {
                    throw new GradleException("Dedicated server reported a startup failure: ${startupFailure.get()}")
                }
                if (!process.isAlive()) {
                    throw new GradleException("Dedicated server exited before readiness with status ${process.exitValue()}")
                }
                if (System.currentTimeMillis() >= startupDeadlineMillis) {
                    throw new GradleException(
                            "Dedicated server did not reach readiness within ${startupTimeoutSeconds} seconds")
                }
                Thread.sleep(100)
            }
            logger.lifecycle('Dedicated server reached the canonical Done ready state.')

            process.outputStream.write('stop\n'.getBytes(java.nio.charset.StandardCharsets.UTF_8))
            process.outputStream.flush()
            if (!process.waitFor(shutdownTimeoutSeconds, java.util.concurrent.TimeUnit.SECONDS)) {
                throw new GradleException(
                        "Dedicated server did not stop within ${shutdownTimeoutSeconds} seconds")
            }
            outputThread.join(java.util.concurrent.TimeUnit.SECONDS.toMillis(5))
            if (outputThread.isAlive()) throw new GradleException('Dedicated-server log reader did not terminate')
            if (readerFailure.get() != null) throw readerFailure.get()
            if (startupFailure.get() != null) {
                throw new GradleException("Dedicated server reported a failure: ${startupFailure.get()}")
            }
            if (!stopping.get()) throw new GradleException('Dedicated server did not acknowledge the stop command')
            if (process.exitValue() != 0) {
                throw new GradleException("Dedicated server exited with status ${process.exitValue()}")
            }
            logger.lifecycle('Dedicated server accepted stop and exited with status 0.')
        } catch (Throwable failure) {
            smokeFailure = failure
        } finally {
            boolean cleanupInterrupted = false
            if (process != null && process.isAlive()) {
                List<ProcessHandle> descendants = process.toHandle().descendants().toList().reverse()
                descendants.each { it.destroy() }
                process.destroy()
                try {
                    process.waitFor(5, java.util.concurrent.TimeUnit.SECONDS)
                } catch (InterruptedException ignored) {
                    cleanupInterrupted = true
                }
                descendants.findAll { it.isAlive() }.each { it.destroyForcibly() }
                if (process.isAlive()) process.destroyForcibly()
                try {
                    process.waitFor(5, java.util.concurrent.TimeUnit.SECONDS)
                } catch (InterruptedException ignored) {
                    cleanupInterrupted = true
                }
            }
            if (outputThread != null) {
                try {
                    outputThread.join(java.util.concurrent.TimeUnit.SECONDS.toMillis(5))
                } catch (InterruptedException ignored) {
                    cleanupInterrupted = true
                }
            }
            if (cleanupInterrupted) Thread.currentThread().interrupt()
        }

        if (smokeFailure != null) {
            logger.error("Dedicated-server smoke failure: ${smokeFailure.message}")
            logger.error("Dedicated-server smoke log tail (${logFile}):")
            synchronized (tail) { tail.each { logger.error(it) } }
            throw new GradleException("Dedicated-server smoke failed; retained log: ${logFile}", smokeFailure)
        }
        logger.lifecycle("Dedicated-server smoke log retained at: ${logFile}")
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
             mod_version            : mod_version,
            create_version         : create_version,
            create_mod_version     : create_mod_version,
            spore_version          : spore_version,
            tfmg_version           : tfmg_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.withType(Jar).configureEach {
    includeEmptyDirs = false
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
